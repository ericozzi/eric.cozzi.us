experience:
  - company: "Hewlett Packard Enterprise (formerly Cray, Inc.)"
    logo: "/images/logos/hpe.png"
    role: "Principal Systems / Software Engineer"
    period: "2014 – Present"
    location: "Twin Cities, MN"
    overview: >
      Principal systems engineer architecting and developing distributed runtime and cloud-native
      provisioning infrastructure for leadership-class exascale supercomputers, spanning DragonHPC
      and the HPE Cray EX Image Management System (IMS) through HPE's 2019 acquisition of Cray.
    initiatives:
      - title: "Core Developer of HPE Dragon Distributed Runtime (DragonHPC)"
        summary: "Core systems developer for DragonHPC, HPE's open-source distributed runtime powering post-exascale HPC and AI workloads across heterogeneous clusters."
        bullets:
          - label: "Dragon Launcher Re-Architecture"
            text: "Re-architected the multi-node Dragon launcher to streamline runtime bootstrap, control-plane initialization, and graceful teardown across HPC workload managers (Slurm, PBS/PALS), SSH, and Kubernetes environments—improving startup reliability and resilience at cluster scale."
          - label: "dragon-run Library Development"
            text: "Designed and developed the dragon-run library, giving users and distributed workflows a clean programmatic and CLI interface to launch, manage, and coordinate multi-node executables and parallel tasks across cluster allocations."
          - label: "Global Services (GS) & Local Services (LS) Engineering"
            text: "Implemented and optimized core features across Dragon's distributed control plane—spanning cluster-wide resource orchestration and state management in Global Services (GS) and node-level process spawning, monitoring, and I/O routing in Local Services (LS)."
          - label: "End-to-End Runtime Integration & Open-Source Delivery"
            text: "Contributed across nearly every layer of the open-source DragonHPC Python runtime stack—extending standard multiprocessing capabilities, hardening cross-node fault handling, and tuning multi-node execution performance from developer laptops to exascale systems."
      - title: "Architect and Lead Developer of HPE Cray EX Image Management System (IMS)"
        summary: "Architect and lead developer for the HPE Cray EX Image Management System (IMS), a cloud-native microservice that re-imagined legacy Cray image tooling for exascale-class supercomputers."
        bullets:
          - label: "Cloud-Native Architecture & Modernization"
            text: "Re-architected legacy monolithic image management tools into a resilient, Kubernetes-hosted microservice deployed within the HPE Cray EX management cluster."
          - label: "RESTful CRUD API & Lifecycle Management"
            text: "Designed and implemented a RESTful CRUD API governing the full lifecycle of bootable node images, image recipes, SSH public keys, and asynchronous build/customization jobs."
          - label: "Containerized Image Build & Customization Workflows"
            text: "Engineered Kubernetes-orchestrated IMS Jobs to automate building bootable node images from recipes and to provision secure, SSH-accessible environments for interactive or automated customization of existing images."
          - label: "Exascale & Multi-Architecture Production Delivery"
            text: "Delivered core image-provisioning infrastructure powering leadership-class HPE Cray EX systems, supporting multi-architecture (x86_64 and aarch64/ARM) compute and service node workflows."
      - title: "Architect and Lead Developer of Cray XC-50 Image Management Tools"
        summary: "Led cross-platform image build architecture and system administration tooling for Cray XC-50 supercomputers."
        bullets:
          - label: "Cross-Platform ARM Image Architecture"
            text: "Architected and led the implementation of QEMU hardware-virtualized build pipelines, enabling x86_64 management nodes to build and customize aarch64 (ARM) compute node images."
          - label: "Cross-Project Tiger Team Leadership"
            text: "Coordinated across engineering, QA, and release organizations within a cross-project tiger team to validate multi-architecture testing and deliver ARM-based support on schedule."
          - label: "RPM Repository & Recipe Management Tooling"
            text: "Engineered Cray administration utilities to manage local RPM repositories and image recipes used to assemble production compute node images."
          - label: "2018 Cray Users Group (CUG) Presenter"
            text: "Authored and delivered a technical presentation at CUG 2018 in Stockholm, Sweden, detailing the QEMU-based cross-platform ARM image build architecture."
      - title: "Core Developer of OpenStack-Based Cray Management System"
        summary: "Core engineer on Cray's high-visibility initiative to modernize supercomputer administration using the cloud-native OpenStack platform. Contributed to the development, build, packaging, installation, configuration, and triage of the OpenStack-based Cray management system."
      - title: "Co-Architect and Developer of OpenStack-Managed Cray External Login Node"
        summary: "Co-architected and developed the redesigned Cray External Login (ELogin) node, utilizing OpenStack Ironic for automated bare-metal provisioning on Cray XC supercomputers. Decoupled user login sessions, Cray programming and compilation environments, and Workload Management (WLM) job submission onto dedicated external nodes—improving system security, scalability, and isolation from internal supercomputer resources."

  - company: "Cray, Inc."
    logo: "/images/logos/cray.png"
    role: "Contractor"
    period: "2012 – 2014"
    location: "Twin Cities, MN"
    overview: >
      Joined Cray's systems software engineering organization as a contractor, developing foundational
      OpenStack-based supercomputer management and bare-metal provisioning infrastructure before
      transitioning into a full-time engineering role.
    details_summary: "Engineered a Python-based automated testing framework to validate Cray XC supercomputer software installations in virtualized environments."
    bullets:
      - label: "End-to-End Installation Automation"
        text: "Built a Python test harness automating the installation and verification of Cray XC System Management Workstation (SMW) and Cray Linux Environment (CLE) releases inside VirtualBox."
      - label: "Hardware Bottleneck Reduction"
        text: "Enabled developers and QA engineers to run repeatable installation tests locally without reserving scarce, expensive physical Cray supercomputer hardware."
      - label: "Release Quality & Velocity"
        text: "Caught installation regressions earlier in the release cycle, improving software reliability and accelerating validation across versioned SMW/CLE builds."

  - company: "SoCoCo: Social Communications Company"
    logo: "/images/logos/sococo.png"
    role: "Senior Software / Network Infrastructure Engineer"
    period: "2010 – 2012"
    location: "Mountain View, CA & Twin Cities, MN"
    overview: >
      Architected and developed real-time VoIP and spatial telephony services enabling distributed
      teams to place and bridge phone calls directly within virtual offices and conference rooms—work
      that yielded two granted U.S. patents in visual and virtual-area communications.
    details_summary: "Core systems and platform engineer for Sococo Team Space, a real-time SaaS virtual office platform enabling distributed teams to collaborate via spatial audio, video, screen sharing, and patented VoIP telephony."
    bullets:
      - label: "PSTN VoIP Gateway Architecture & Operations"
        text: "Architected, developed, and operationally managed Sococo's production PSTN VoIP Gateway—a real-time, multi-threaded C/C++ Linux daemon enabling 25,000+ users to initiate and bridge live telephone calls directly inside virtual offices and conference rooms."
      - label: "Cross-Platform Client Engine"
        text: "Engineered core components of Sococo's cross-platform abstraction layer (Windows, Linux, macOS, and iOS) and real-time collaboration engine as part of a 6-person Agile Client Platform Team."
      - label: "Patented Telephony Innovation"
        text: "Co-invented the core spatial-telephony integration architecture granted under U.S. Patent 9,357,025 (Virtual Area Based Telephony Communications, Granted May 31, 2016) and continuation U.S. Patent 12,473,234 (Visual Communications, Granted November 18, 2025)."

  - company: "Cisco Systems, Inc."
    logo: "/images/logos/cisco.png"
    role: "Senior Software Engineer IV"
    period: "2005 – 2010"
    location: "San Jose, CA"
    overview: >
      Served as lead developer on the Cisco IPICS Emergency Dispatch client, engineering
