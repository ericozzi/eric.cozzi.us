    details_summary: "Senior systems engineer in Cisco's elite Emerging Technologies Group (ETG), incubating next-generation, $1B+ commercial product initiatives from initial concept through enterprise deployment."
    bullets:
      - label: "Cisco IPICS Architecture & Technical Leadership"
        text: "Founding Senior Engineer from product inception and Technical Lead for versions 3.0 and 4.0 of Cisco IPICS (IP Interoperability and Collaboration System), enabling real-time communication interoperability and incident response across disparate IP/VoIP and RF radio networks."
      - label: "Emergency Dispatch Client & Real-Time Media"
        text: "Lead developer for the Cisco IPICS Emergency Dispatch client, engineering mission-critical push-to-talk (PTT), multi-channel audio routing, and command-and-control workflows for public safety and defense operations."
      - label: "Patented Communications Innovation"
        text: "Invented state-driven session routing and multi-party stream access control architectures resulting in U.S. Patent 8,547,856 (Communication System with State Dependent Parameters, Granted October 1, 2013) and U.S. Patent 8,589,678 (Managing Status and Access for a Variable Source Content Stream, Granted November 19, 2013)."

